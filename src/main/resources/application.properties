spring.application.name=api-tienda

server.port=${SERVER_PORT:${PORT:8081}}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:postgresql://${DB_HOST:${PGHOST:localhost}}:${DB_PORT:${PGPORT:5433}}/${DB_NAME:${PGDATABASE:lms_db}}

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.datasource.username=${DB_USER:${PGUSER:test}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:test}}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto= update
spring.jpa.show-sql=true

security.jwt.secret=${JWT_SECRET:efcwevedfbdsadwfojroansckwvnvienqoamdcovmoeakspcdpvnveuniewcjkspfbk}
security.jwt.expiration-seconds=${JWT_EXPIRATION:3600}

# CORS (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Auth cookie (used by browsers; Postman can still use Authorization: Bearer ...)
app.auth.cookie-name=${AUTH_COOKIE_NAME:ACCESS_TOKEN}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-samesite=${AUTH_COOKIE_SAMESITE:Lax}
