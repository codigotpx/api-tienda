spring.application.name=api-tienda

server.port=${SERVER_PORT:8081}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:lms_db}

spring.jpa.defer-datasource-initialization=true
spring.datasource.username=${DB_USER:test}
spring.datasource.password=${DB_PASSWORD:test}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto= update
spring.jpa.show-sql=true

security.jwt.secret=${JWT_SECRET:efcwevedfbdsadwfojroansckwvnvienqoamdcovmoeakspcdpvnveuniewcjkspfbk}
security.jwt.expiration-seconds=${JWT_EXPIRATION:3600}

# CORS (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Auth cookie (used by browsers; Postman can still use Authorization: Bearer ...)
app.auth.cookie-name=${AUTH_COOKIE_NAME:ACCESS_TOKEN}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-samesite=${AUTH_COOKIE_SAMESITE:Lax}
